name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Test core
        run: gradle :openmrz-core:test --stacktrace

      - name: Build sample APK
        run: gradle :sample:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMRZ-Android-debug
          path: sample/build/outputs/apk/debug/sample-debug.apk
