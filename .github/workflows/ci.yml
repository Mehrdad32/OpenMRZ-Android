name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GROUP: ir.mehrdad32.openmrz
      VERSION: 0.2.0-beta.6-ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Test parsers and OCR post-processing
        run: |
          ./gradlew :openmrz-core:test :openmrz-ocr:test --stacktrace

      - name: Build SDK AARs and sample APK
        run: |
          ./gradlew :openmrz-ocr:assembleRelease :openmrz-android:assembleRelease :sample:assembleDebug --stacktrace

      - name: Verify Maven publication
        run: ./gradlew publishToMavenLocal --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OpenMRZ-Android-CI
          path: |
            sample/build/outputs/apk/debug/sample-debug.apk
            openmrz-ocr/build/outputs/aar/openmrz-ocr-release.aar
            openmrz-android/build/outputs/aar/openmrz-android-release.aar
