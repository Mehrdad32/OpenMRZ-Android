name: Release APK

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build and test
        run: |
          gradle :openmrz-core:test
          gradle :sample:assembleDebug

      - name: Prepare release asset
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp sample/build/outputs/apk/debug/sample-debug.apk "OpenMRZ-Android-$VERSION.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: OpenMRZ Android ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: OpenMRZ-Android-${{ env.VERSION }}.apk
