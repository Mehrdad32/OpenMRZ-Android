name: Release SDK and APK

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GROUP: ir.mehrdad32.openmrz
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Test, build SDK and verify Maven publication
        run: |
          ./gradlew :openmrz-core:test :openmrz-ocr:test
          ./gradlew :openmrz-ocr:assembleRelease :openmrz-android:assembleRelease :sample:assembleDebug
          ./gradlew publishToMavenLocal

      - name: Prepare release assets
        shell: bash
        run: |
          cp sample/build/outputs/apk/debug/sample-debug.apk "OpenMRZ-Android-$VERSION.apk"
          cp openmrz-android/build/outputs/aar/openmrz-android-release.aar "openmrz-android-$VERSION.aar"
          cp openmrz-ocr/build/outputs/aar/openmrz-ocr-release.aar "openmrz-ocr-$VERSION.aar"
          sha256sum             "OpenMRZ-Android-$VERSION.apk"             "openmrz-android-$VERSION.aar"             "openmrz-ocr-$VERSION.aar"             > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: OpenMRZ Android ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            OpenMRZ beta 6 fast hybrid OCR stabilization.

            - Removed arbitrary line-by-line ensemble that could combine unrelated OCR lines
            - BALANCED mode now uses FAST first and at most one targeted generic second-line fallback
            - Checksum-valid FAST candidates stop immediately instead of entering expensive fallback chains
            - BEST/exhaustive OCR is reserved for ACCURATE mode
            - Tester pauses only on reviewable candidates, not weak NEEDS_REVIEW noise
            - ICAO name structure now requires the expected << separator
            - Beta 4 image-only API, auto-pause, Retry, and CameraX-optional architecture are retained

            Assets include both SDK AARs, the sample APK, and SHA-256 checksums.
          files: |
            OpenMRZ-Android-${{ env.VERSION }}.apk
            openmrz-android-${{ env.VERSION }}.aar
            openmrz-ocr-${{ env.VERSION }}.aar
            SHA256SUMS.txt
